<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OmniDL Test Video Player</title>
  <style>
    body {
      background: #0f1117;
      color: #e6edf3;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 600px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 16px;
      background: #000;
    }
    h1 {
      font-size: 20px;
      color: #58a6ff;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 OmniDL Pro Stream Capture Test Page</h1>
    <p>Simulating a video stream page on local loopback.</p>
    
    <video id="player" controls autoplay loop>
      <source src="/sample_stream.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</body>
</html>
